name: studexa
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.9.0
  file_picker: ^12.2.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  google_sign_in: ^6.2.2
  flutter:
    sdk: flutter
  archive: ^4.0.9
  http: ^1.6.0
  pdf: ^3.13.0
  printing: ^5.15.0
  syncfusion_flutter_pdf: ^34.2.6
  syncfusion_flutter_pdfviewer: ^34.2.6
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Studexa_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/Studexa_icon.png
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true
