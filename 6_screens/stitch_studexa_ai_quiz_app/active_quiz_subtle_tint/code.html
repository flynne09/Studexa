<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#001945", "primary-fixed-dim": "#bdc2ff", "surface-container-highest": "#e4e2e1", "on-surface": "#1b1c1c", "on-secondary-container": "#61646e", "secondary-fixed-dim": "#c4c6d2", "surface-dim": "#dcd9d9", "inverse-surface": "#303030", "background": "#fbf9f8", "on-primary-container": "#8690ee", "tertiary-container": "#002c6d", "primary-container": "#1a237e", "on-primary-fixed-variant": "#343d96", "on-background": "#1b1c1c", "tertiary": "#001943", "surface-bright": "#fbf9f8", "surface": "#fbf9f8", "on-surface-variant": "#454652", "primary-fixed": "#e0e0ff", "on-error-container": "#93000a", "on-secondary-fixed-variant": "#434750", "surface-container-low": "#f5f3f3", "surface-container": "#f0eded", "secondary-fixed": "#e0e2ee", "on-tertiary-container": "#6294ff", "on-error": "#ffffff", "tertiary-fixed-dim": "#b0c6ff", "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#00429b", "outline-variant": "#c6c5d4", "inverse-primary": "#bdc2ff", "surface-tint": "#4c56af", "primary": "#000666", "on-secondary": "#ffffff", "on-secondary-fixed": "#181b24", "error": "#ba1a1a", "surface-container-high": "#eae8e7", "surface-variant": "#e4e2e1", "surface-container-lowest": "#ffffff", "inverse-on-surface": "#f2f0f0", "secondary-container": "#e0e2ee", "outline": "#767683", "on-primary-fixed": "#000767", "secondary": "#5b5e68", "tertiary-fixed": "#d9e2ff", "on-tertiary": "#ffffff", "error-container": "#ffdad6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "md": "16px", "xl": "32px", "lg": "24px", "xs": "8px", "base": "4px", "margin-mobile": "20px", "sm": "12px", "gutter-mobile": "12px" }, "fontFamily": { "display-lg": ["Inter"], "title-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-md": ["Inter"] } } } }</script><style>@layer base { .pt-safe { padding-top: env(safe-area-inset-top); } } </style></head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface-variant" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-sm flex-1"><div class="h-7 w-7 rounded-full bg-surface-container-highest"></div><span class="font-title-lg text-title-lg text-primary truncate">Study Session</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 min-h-screen" style="background: linear-gradient(135deg, #F3F0FF 0%, #EFF6FF 100%);"><div class="flex flex-col w-full h-full pb-32">
<div class="px-margin-mobile py-xl space-y-lg flex-1">
<div class="flex items-center justify-between">
<div class="flex items-center gap-xs">
<span class="text-label-md text-on-surface-variant tracking-widest uppercase">Question 3 of 10</span>
</div>
<div class="bg-primary-fixed text-on-primary-fixed px-sm py-1 rounded-full text-label-md font-medium">Multiple Choice</div>
</div>
<div class="space-y-md">
<h2 class="text-headline-md text-on-surface leading-tight">Which of the following cellular organelles is primarily responsible for generating ATP?</h2>
<button class="flex items-center gap-xs text-secondary hover:text-primary transition-colors py-2 group" id="flag-btn">
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:scale-110" id="flag-icon">flag</span>
<span class="text-body-md font-medium" id="flag-text">Flag for review</span>
</button>
</div>
<div class="space-y-sm pt-4" id="quiz-options">
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="A">
<div class="p-lg rounded-xl bg-surface-container-low border border-surface-dim transition-all duration-200 peer-checked:bg-primary-fixed peer-checked:shadow-md group-hover:bg-surface-container group-hover:shadow-md group-hover:-translate-y-0.5 flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-body-md font-medium text-on-primary-fixed peer-checked:bg-primary peer-checked:text-on-primary transition-colors shadow-sm">A</div>
<span class="text-body-lg text-on-surface peer-checked:text-on-primary-fixed peer-checked:font-medium font-medium">Nucleus</span>
</div>
</label>
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="B">
<div class="p-lg rounded-xl bg-surface-container-low border border-surface-dim transition-all duration-200 peer-checked:bg-primary-fixed peer-checked:shadow-md group-hover:bg-surface-container group-hover:shadow-md group-hover:-translate-y-0.5 flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-body-md font-medium text-on-primary-fixed peer-checked:bg-primary peer-checked:text-on-primary transition-colors shadow-sm">B</div>
<span class="text-body-lg text-on-surface peer-checked:text-on-primary-fixed peer-checked:font-medium font-medium">Mitochondria</span>
</div>
</label>
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="C">
<div class="p-lg rounded-xl bg-surface-container-low border border-surface-dim transition-all duration-200 peer-checked:bg-primary-fixed peer-checked:shadow-md group-hover:bg-surface-container group-hover:shadow-md group-hover:-translate-y-0.5 flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-body-md font-medium text-on-primary-fixed peer-checked:bg-primary peer-checked:text-on-primary transition-colors shadow-sm">C</div>
<span class="text-body-lg text-on-surface peer-checked:text-on-primary-fixed peer-checked:font-medium font-medium">Golgi Apparatus</span>
</div>
</label>
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="quiz_answer" type="radio" value="D">
<div class="p-lg rounded-xl bg-surface-container-low border border-surface-dim transition-all duration-200 peer-checked:bg-primary-fixed peer-checked:shadow-md group-hover:bg-surface-container group-hover:shadow-md group-hover:-translate-y-0.5 flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-body-md font-medium text-on-primary-fixed peer-checked:bg-primary peer-checked:text-on-primary transition-colors shadow-sm">D</div>
<span class="text-body-lg text-on-surface peer-checked:text-on-primary-fixed peer-checked:font-medium font-medium">Ribosomes</span>
</div>
</label>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface/90 backdrop-blur-md shadow-[0_-4px_24px_rgba(0,0,0,0.05)] pb-safe z-10">
<div class="flex items-center gap-4">
<div class="flex-1 h-2 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[30%] rounded-full transition-all duration-500 ease-out"></div>
</div>
<button class="bg-primary text-on-primary px-xl py-3 rounded-xl text-body-lg font-medium shadow-md hover:bg-primary/90 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2" id="next-btn">
        Next
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const flagBtn = document.getElementById('flag-btn');
      const flagIcon = document.getElementById('flag-icon');
      const flagText = document.getElementById('flag-text');
      const nextBtn = document.getElementById('next-btn');
      const radioInputs = document.querySelectorAll('input[name="quiz_answer"]');
      let isFlagged = false;

      flagBtn.addEventListener('click', () => {
        isFlagged = !isFlagged;
        if (isFlagged) {
          flagIcon.style.fontVariationSettings = "'FILL' 1";
          flagIcon.classList.remove('text-secondary');
          flagIcon.classList.add('text-[#ea4335]'); // Semantic color for flag
          flagText.textContent = "Flagged";
          flagBtn.classList.add('bg-surface-container-low', 'px-3', 'rounded-lg');
          flagBtn.classList.remove('text-secondary');
        } else {
          flagIcon.style.fontVariationSettings = "'FILL' 0";
          flagIcon.classList.add('text-secondary');
          flagIcon.classList.remove('text-[#ea4335]');
          flagText.textContent = "Flag for review";
          flagBtn.classList.remove('bg-surface-container-low', 'px-3', 'rounded-lg');
          flagBtn.classList.add('text-secondary');
        }
      });

      radioInputs.forEach(input => {
        input.addEventListener('change', () => {
          if (document.querySelector('input[name="quiz_answer"]:checked')) {
            nextBtn.removeAttribute('disabled');
            nextBtn.classList.add('animate-[pulse_1s_ease-in-out]');
            setTimeout(() => {
              nextBtn.classList.remove('animate-[pulse_1s_ease-in-out]');
            }, 1000);
          }
        });
      });
    });
  </script>
</div></main>
</body></html>
