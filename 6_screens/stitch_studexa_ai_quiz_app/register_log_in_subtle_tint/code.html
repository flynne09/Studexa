<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#001945", "primary-fixed-dim": "#bdc2ff", "surface-container-highest": "#e4e2e1", "on-surface": "#1b1c1c", "on-secondary-container": "#61646e", "secondary-fixed-dim": "#c4c6d2", "surface-dim": "#dcd9d9", "inverse-surface": "#303030", "background": "#fbf9f8", "on-primary-container": "#8690ee", "tertiary-container": "#002c6d", "primary-container": "#1a237e", "on-primary-fixed-variant": "#343d96", "on-background": "#1b1c1c", "tertiary": "#001943", "surface-bright": "#fbf9f8", "surface": "#fbf9f8", "on-surface-variant": "#454652", "primary-fixed": "#e0e0ff", "on-error-container": "#93000a", "on-secondary-fixed-variant": "#434750", "surface-container-low": "#f5f3f3", "surface-container": "#f0eded", "secondary-fixed": "#e0e2ee", "on-tertiary-container": "#6294ff", "on-error": "#ffffff", "tertiary-fixed-dim": "#b0c6ff", "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#00429b", "outline-variant": "#c6c5d4", "inverse-primary": "#bdc2ff", "surface-tint": "#4c56af", "primary": "#000666", "on-secondary": "#ffffff", "on-secondary-fixed": "#181b24", "error": "#ba1a1a", "surface-container-high": "#eae8e7", "surface-variant": "#e4e2e1", "surface-container-lowest": "#ffffff", "inverse-on-surface": "#f2f0f0", "secondary-container": "#e0e2ee", "outline": "#767683", "on-primary-fixed": "#000767", "secondary": "#5b5e68", "tertiary-fixed": "#d9e2ff", "on-tertiary": "#ffffff", "error-container": "#ffdad6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "md": "16px", "xl": "32px", "lg": "24px", "xs": "8px", "base": "4px", "margin-mobile": "20px", "sm": "12px", "gutter-mobile": "12px" }, "fontFamily": { "display-lg": [" <!-- Subtle background ambient blur -->
<div class="absolute left-1/2 -translate-x-1/2 w-[150%] h-64 from-primary-container/40 via-surface to-transparent rounded-full blur-3xl -z-10 pointer-events-none bottom-0 bg-gradient-to-t"></div>
<div class="flex flex-col w-full px-margin-mobile py-xl items-center flex-grow justify-between"><!-- Main Content Wrapper (Centered) -->
<div class="flex-grow flex flex-col items-center justify-center w-full">
<!-- Logo & Welcome -->
<div class="flex flex-col items-center text-center max-w-[280px] mb-lg">
<div class="w-20 h-20 bg-surface rounded-2xl shadow-sm border border-outline-variant/30 flex items-center justify-center mb-lg p-2 relative">
<div class="absolute inset-0 bg-primary/5 rounded-2xl"></div>
<div class="w-full h-full bg-surface-container-highest rounded-full relative z-10"></div>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-background mb-xs">
      Studexa
    </h1>
<p class="text-body-md font-bold text-on-surface-variant"><span class="font-headline-lg text-[20px]">Create Quizzes from Your Study Materials</span></p>
</div>
<!-- Login Form -->
<form class="w-full max-w-sm flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="text-label-md font-label-md text-on-surface-variant pl-1" for="email">
        Email
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">
          mail
        </span>
<input class="w-full bg-surface text-body-md font-body-md text-on-surface border border-outline-variant rounded-lg pl-[40px] pr-md py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="email" placeholder="student@university.edu" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex items-center justify-between pl-1 pr-1">
<label class="text-label-md font-label-md text-on-surface-variant" for="password">
          Password
        </label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">
          lock
        </span>
<input class="w-full bg-surface text-body-md font-body-md text-on-surface border border-outline-variant rounded-lg pl-[40px] pr-[40px] py-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-sm text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-md">
<button class="w-full bg-primary text-on-primary text-label-lg font-label-lg py-sm rounded-lg hover:scale-[0.98] active:scale-95 transition-transform flex items-center justify-center gap-xs shadow-md" type="submit">
        Log In
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button><div class="flex justify-end"><a class="text-label-md font-label-md text-primary hover:underline" href="#">Forgot password?</a></div>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-sm text-label-md font-label-md text-outline">or</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<button class="w-full bg-surface border text-on-surface text-label-lg font-label-lg py-sm rounded-lg shadow-sm hover:bg-surface-container-low hover:scale-[0.98] active:scale-95 transition-all flex items-center justify-center gap-sm border-outline-variant" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
        Sign in with Google
      </button>
</div>
</form>
</div>
<!-- Footer Register Link (Bottom) -->
<div class="w-full flex justify-center py-sm">
<p class="text-body-md font-body-md text-on-surface">
    Don't have an account? 
    <a class="text-primary font-label-lg text-label-lg hover:underline decoration-2 underline-offset-4 transition-all font-bold" href="#">
      Register
    </a>
</p>
</div></div>
</div></main>






</body></html>
