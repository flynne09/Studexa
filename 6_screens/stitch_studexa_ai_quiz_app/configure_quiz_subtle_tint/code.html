<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

Inter"], "title-lg": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-md": ["Inter"] } } } }</script><style>@layer base { .pt-safe { padding-top: env(safe-area-inset-top); } } </style></head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center gap-md"><button class="w-10 h-10 flex items-center justify-center -ml-2 text-on-surface-variant" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex items-center gap-sm flex-1"><div class="h-7 w-7 rounded-full bg-surface-container-highest shrink-0"></div><span class="font-title-lg text-title-lg text-primary truncate">Study Session</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 min-h-screen" style="background: linear-gradient(135deg, #F3F0FF 0%, #EFF6FF 100%);"><div class="flex flex-col w-full h-full p-margin-mobile gap-xl">
<!-- Context Header Section -->
<div class="flex flex-col gap-sm">
<div class="flex items-center gap-sm bg-surface-container-low p-md rounded-xl shadow-sm">
<div class="w-10 h-10 rounded-lg bg-tertiary-container text-on-tertiary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[24px]">description</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-lg text-title-lg text-on-surface truncate">Generating quiz from:</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate">Biology_Ch4.pdf</span>
</div>
</div>
<div class="flex items-center gap-xs px-sm">
<span class="material-symbols-outlined text-[16px] text-primary">auto_awesome</span>
<span class="font-label-md text-label-md text-primary">Estimated: 12 questions available from source</span>
</div>
</div>
<!-- Question Count Configuration -->
<div class="flex flex-col gap-md">
<div class="flex items-center justify-between">
<h2 class="font-title-lg text-title-lg text-on-surface">Number of Questions</h2>
<div class="flex items-center gap-sm"><span class="font-headline-md text-headline-md text-primary hidden" id="question-count-display">11</span></div>
</div>
<div class="relative w-full h-12 flex items-center"><div class="absolute -top-2 left-1/2 -translate-x-1/2 font-headline-md text-primary transition-all pointer-events-none" id="slider-value-label">10</div>
<input class="w-full h-2 bg-surface-container-highest rounded-full appearance-none cursor-pointer outline-none focus:ring-2 focus:ring-primary/20 accent-primary" id="question-slider" max="100" min="10" type="range" value="10">
</div>
<div class="flex justify-between w-full px-1">
<span class="font-label-md text-label-md text-on-surface-variant">10</span>
<span class="font-label-md text-label-md text-on-surface-variant">100</span>
</div>
</div>
<!-- Question Types Selection -->
<div class="flex flex-col gap-md">
<div class="flex items-center justify-between">
<h2 class="font-title-lg text-title-lg text-on-surface">Question Types</h2>
<span class="font-label-md text-label-md text-on-surface-variant">Select at least one</span>
</div>
<div class="flex flex-wrap gap-sm">
<!-- Active Chip -->
<button class="type-chip h-8 px-md rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95 scale-[1.05] shadow-md" data-active="true">
<span class="material-symbols-outlined text-[16px]">check</span>
        Multiple Choice
      </button>
<!-- Inactive Chips -->
<button class="type-chip h-8 px-md rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95" data-active="true">
<span class="material-symbols-outlined text-[16px]">check</span>
        True/False
      </button>
<button class="type-chip h-8 px-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95 scale-[1.05]" data-active="false">
<span class="material-symbols-outlined text-[16px] hidden">check</span>
        Fill-in-the-Blank
      </button>
<button class="type-chip h-8 px-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95" data-active="false">
<span class="material-symbols-outlined text-[16px] hidden">check</span>
        Identification
      </button>
<button class="type-chip h-8 px-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95 scale-[1.05]" data-active="false">
<span class="material-symbols-outlined text-[16px] hidden">check</span>
        Enumeration
      </button>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- Bottom Action Area -->
<div class="mt-xl pb-md">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-sm shadow-md transition-all active:scale-[0.98] active:shadow-sm">
<span class="material-symbols-outlined text-[24px]">model_training</span>
      Generate Quiz
    </button>
</div>
<script class="">
  const sliderSync = document.getElementById('question-slider');
  const inputSync = document.getElementById('question-input');
  const displaySync = document.getElementById('question-count-display');

  sliderSync.addEventListener('input', (e) => {
    inputSync.value = e.target.value;
    displaySync.textContent = e.target.value;
  });

  inputSync.addEventListener('input', (e) => {
    let val = parseInt(e.target.value);
    if (isNaN(val)) return;
    if (val < 1) val = 1;
    if (val > 20) val = 20;
    
    sliderSync.value = val;
    displaySync.textContent = val;
  });

  inputSync.addEventListener('blur', (e) => {
    if (e.target.value === '' || parseInt(e.target.value) < 1) e.target.value = 1;
    if (parseInt(e.target.value) > 20) e.target.value = 20;
  });
</script></div>
<script>
  // Slider Logic
  const slider = document.getElementById('question-slider');
  const display = document.getElementById('question-count-display');

  slider.addEventListener('input', (e) => {
    display.textContent = e.target.value;
  });

  // Chip Toggle Logic
  const chips = document.querySelectorAll('.type-chip');
  
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      const isActive = chip.getAttribute('data-active') === 'true';
      const icon = chip.querySelector('.material-symbols-outlined');
      
      if (isActive) {
        // Prevent deselecting if it's the last active chip
        const activeCount = document.querySelectorAll('.type-chip[data-active="true"]').length;
        if (activeCount > 1) {
          chip.setAttribute('data-active', 'false');
          chip.className = 'type-chip h-8 px-md rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95';
          icon.classList.add('hidden');
        }
      } else {
        chip.setAttribute('data-active', 'true');
        chip.className = 'type-chip h-8 px-md rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center gap-xs shadow-sm transition-all active:scale-95';
        icon.classList.remove('hidden');
      }
    });
  });
</script></main>
<script class="">
  (function() {
    const slider = document.getElementById('question-slider');
    const label = document.getElementById('slider-value-label');
    if (slider && label) {
      slider.addEventListener('input', (e) => {
        label.textContent = e.target.value;
      });
    }
  })();
</script></body></html>
